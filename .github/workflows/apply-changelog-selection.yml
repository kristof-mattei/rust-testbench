# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Apply changelog selection

# The release PR body is a ballot: every changelog entry is a checkbox.
# Toggling one edits the PR body, which fires pull_request:edited.
# This workflow turns the unchecked entries into .cliffignore, regenerates CHANGELOG.md and rebuilds the release commit.

on:
  pull_request:
    types:
      - edited

permissions:
  contents: read

jobs:
  apply:
    name: Apply changelog selection
    runs-on: ubuntu-26.04
    permissions:
      contents: write # to rebuild the release commit via createCommitOnBranch
      pull-requests: write # to refresh the release PR body
    # Shared with the Release workflow, both force-push release branches and rewrite release PR bodies.
    # Job-level, body edits on non-release PRs skip the job without entering the group.
    concurrency:
      group: release-branch-writes
      # Cancelling could kill a run mid-force-push. GitHub keeps only the newest queued run per group, so stacked toggles settle on the newest body.
      cancel-in-progress: false
    if: |
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.changes.body != null
    steps:
      # zizmor: ignore[artipacked] the release branch is pushed with this credential, see the rebuild step
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          token: ${{ secrets.TOKEN_TO_TRIGGER_SUBSEQUENT_WORKFLOWS }}

      - name: Install git-cliff to regenerate the changelog
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: git-cliff

      - name: Compute selection from the PR body
        id: ballot
        uses: ./.github/actions/compute-changelog-selection
        with:
          body: ${{ github.event.pull_request.body }}

      - name: Compare with the applied selection
        shell: bash
        id: selection
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SELECTION_FILE: ${{ steps.ballot.outputs.selection-file }}
        run: |
          # release/v0.4.8 -> v0.4.8
          tag="${BRANCH#release/}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          git show "HEAD:.cliffignore" > "${RUNNER_TEMP}/current.cliffignore" 2> /dev/null || true

          if cmp --silent "${SELECTION_FILE}" "${RUNNER_TEMP}/current.cliffignore"; then
            echo "::notice::Selection unchanged, nothing to do"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Disarm auto-merge while curating
        if: steps.selection.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A green check run finishing mid-curation must not ship the release out from under the operator
          if [ "$(gh pr view "${PR_NUMBER}" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            gh pr merge --disable-auto "${PR_NUMBER}"
            echo "::notice::This selection change disarmed auto-merge, re-arm it once the ballot is final"
          fi

      - name: Regenerate changelog
        if: steps.selection.outputs.changed == 'true'
        shell: bash
        env:
          # git-cliff reads GITHUB_TOKEN from the environment
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.selection.outputs.tag }}
          SELECTION_FILE: ${{ steps.ballot.outputs.selection-file }}
        run: |
          # The ballot context lists every commit, so build it without a .cliffignore in the worktree
          rm --force .cliffignore
          git-cliff --context --unreleased --tag "${TAG}" > ballot-context.json

          if [ -s "${SELECTION_FILE}" ]; then
            cp "${SELECTION_FILE}" .cliffignore
          fi

          # git-cliff skips the commits listed in .cliffignore
          git-cliff --output CHANGELOG.md --tag "${TAG}"

      - name: Rebuild release commit
        id: commit
        if: steps.selection.outputs.changed == 'true'
        uses: ./.github/actions/create-release-commit
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          base-sha: ${{ steps.ballot.outputs.base-sha }}
          headline: "chore(release): prepare for ${{ steps.selection.outputs.tag }}"
          files: CHANGELOG.md .cliffignore
          staging-suffix: -selection-staging
          # GITHUB_TOKEN attributes the API commit to github-actions[bot].
          # The branch itself is pushed with the checkout PAT so workflows trigger.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render the ballot
        id: ballot-body
        if: steps.selection.outputs.changed == 'true'
        uses: ./.github/actions/render-ballot-body
        with:
          context-file: ballot-context.json
          compare-to: ${{ steps.commit.outputs.commit-sha }}
          excluded-file: .cliffignore

      - name: Refresh pull request body
        if: steps.selection.outputs.changed == 'true'
        shell: bash
        env:
          # The default token's edits don't fire pull_request events, so this update can't retrigger this workflow
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BODY_FILE: ${{ steps.ballot-body.outputs.body-file }}
        run: |
          # REST PATCH instead of gh pr edit, which needs read:org (cli/cli#13575)
          gh api --method PATCH --silent "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --field "body=@${BODY_FILE}"

      - name: Clean up stranded staging branch
        if: failure() || cancelled()
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git push origin --delete "${BRANCH}-selection-staging" || true
