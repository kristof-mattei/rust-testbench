# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Rebuild release after push

on:
  push:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false # every push must dispatch, a cancelled run leaves the release PR stale

permissions:
  contents: read

jobs:
  rebuild:
    name: Re-run Release for open release PRs
    runs-on: ubuntu-26.04
    permissions:
      actions: write # to dispatch the Release workflow
      pull-requests: read # to list open release PRs and the PR merged by this push
    steps:
      - name: Dispatch Release for every open release PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Merging a release PR is handled by Graduate Release, which tags and closes the other release PRs.
          # Dispatching Release here would race it and rebuild PRs it is about to close.
          merged_release_prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("release/v")))] | length')

          if [ "${merged_release_prs}" -ne 0 ]; then
            echo "::notice::This push merged a release PR, nothing to rebuild"
            exit 0
          fi

          # One dispatch per pre-release type, Release's concurrency group is keyed on it.
          # release/v1.2.3 -> none, release/v1.2.3-alpha.1 -> alpha
          gh pr list \
            --state open \
            --limit 100 \
            --json headRefName,autoMergeRequest \
          | jq --raw-output --arg re '-(?<type>alpha|beta|rc)\.[0-9]+$' '
              [ .[]
                | select(.headRefName | startswith("release/v"))
                | {
                    prerelease: (.headRefName | if test($re) then capture($re).type else "none" end),
                    auto_merge: (.autoMergeRequest != null)
                  }
              ]
              | group_by(.prerelease)[]
              | "\(.[0].prerelease) \(any(.auto_merge))"
            ' \
          | while read -r prerelease auto_merge; do
            echo "::notice::Dispatching Release with prerelease=${prerelease} auto_merge=${auto_merge}"

            gh workflow run release.yml \
              --ref main \
              --raw-field prerelease="${prerelease}" \
              --raw-field auto_merge="${auto_merge}"
          done
