# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Verify changelog selection

# Required status check closing three gaps between the ballot and the release commit:
# - toggling a ballot entry turns this red on the stale release commit, and it only goes green again once the apply workflow has rebuilt the branch
# - "Update branch" (merge or rebase) advances the branch without re-cutting the ballot, so pulled-in commits that never got a checkbox turn this red until the Release workflow is re-run
# - every entry starts unchecked, so an untouched ballot would ship a release without a changelog section

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify changelog selection
    runs-on: ubuntu-26.04
    # Skipped on non-release PRs, a skipped job still satisfies the required check
    if: startsWith(github.event.pull_request.head.ref, 'release/v')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Assert the release commit sits directly on a main commit
        shell: bash
        run: |
          # The Release workflow builds single-parent commits, only "Update branch" puts a merge commit here
          if git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            echo "::error::The release branch head is a merge commit. Don't use Update branch, re-run the Release workflow, it rebuilds the ballot against current main."
            exit 1
          fi

      - name: Install git-cliff to rebuild the ballot context
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: git-cliff

      - name: Assert every commit in range appears on the ballot
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # release/v0.4.8 -> v0.4.8
          tag="${BRANCH#release/}"

          # The context must list every commit, so build it without a .cliffignore in the worktree. Later steps read .cliffignore from git, not the worktree.
          rm --force .cliffignore
          git-cliff --context --unreleased --offline --tag "${tag}" > "${RUNNER_TEMP}/ballot-context.json"

          jq --raw-output '.[0].commits[].id' "${RUNNER_TEMP}/ballot-context.json" | sort --unique > "${RUNNER_TEMP}/expected.txt"

          # A commit is accounted for when the release commit ships it in CHANGELOG.md or excludes it via .cliffignore
          {
            grep --perl-regexp --only-matching '/commit/\K[0-9a-f]{40}(?=\)\)$)' CHANGELOG.md || true
            git show "HEAD:.cliffignore" 2> /dev/null || true
          } | sort --unique > "${RUNNER_TEMP}/accounted.txt"

          missing=$(grep --fixed-strings --line-regexp --invert-match --file "${RUNNER_TEMP}/accounted.txt" "${RUNNER_TEMP}/expected.txt" | tr '\n' ' ' || true)

          if [ -n "${missing}" ]; then
            echo "::error::Commits in the release range never appeared on the ballot: ${missing}. Re-run the Release workflow to rebuild the ballot against current main."
            exit 1
          fi

      - name: Assert at least one ballot entry is checked
        shell: bash
        run: |
          # A promotion release re-tags the previous content, its ballot is legitimately empty
          if [ ! -s "${RUNNER_TEMP}/expected.txt" ]; then
            echo "::notice::Nothing on the ballot, skipping the empty-changelog check"
            exit 0
          fi

          checked=$(grep --perl-regexp --only-matching '/commit/\K[0-9a-f]{40}(?=\)\)$)' CHANGELOG.md | grep --fixed-strings --line-regexp --count --file "${RUNNER_TEMP}/expected.txt" || true)

          if [ "${checked}" -lt 1 ]; then
            echo "::error::No ballot entry is checked, this release would ship without a changelog section. Check at least one entry, the apply workflow rebuilds the release commit."
            exit 1
          fi

          echo "::notice::${checked} changelog entries"

      - name: Compute selection from the PR body
        id: ballot
        uses: $/.github/actions/compute-changelog-selection
        with:
          body: ${{ github.event.pull_request.body }}

      - name: Compare with the committed .cliffignore
        shell: bash
        env:
          SELECTION_FILE: ${{ steps.ballot.outputs.selection-file }}
        run: |
          git show "HEAD:.cliffignore" > "${RUNNER_TEMP}/committed.cliffignore" 2> /dev/null || true

          if ! cmp --silent "${SELECTION_FILE}" "${RUNNER_TEMP}/committed.cliffignore"; then
            echo "::error::The ballot selection hasn't been applied to the release commit yet. The apply workflow rebuilds it, this check re-runs automatically."
            exit 1
          fi
