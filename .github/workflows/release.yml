# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release type"
        type: choice
        default: none
        options:
          - none
          - alpha
          - beta
          - rc
      auto_merge:
        description: "Enable auto-merge on the release PR"
        type: boolean
        default: false

concurrency:
  # Shared with the apply workflow for the same pre-release type, both force-push release branches and rewrite release PR bodies
  group: "release-${{ inputs.prerelease }}"
  cancel-in-progress: false # this job force-pushes branches and opens PRs, let it finish

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
    permissions:
      actions: write # to dispatch this workflow again when main moved during the run
      contents: write # to create the release commit via createCommitOnBranch
      pull-requests: write # to refresh the release PR body with the default token and close superseded release PRs
    steps:
      - name: Only on main
        if: |
          github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Only to be executed on main"
          exit 1

      # zizmor: ignore[artipacked] the release branch is pushed with this credential, see the release step
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          token: ${{ secrets.TOKEN_TO_TRIGGER_SUBSEQUENT_WORKFLOWS }}

      - name: Install git-cliff to generate changelog & next version number
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: git-cliff

      - name: Compute version and build the ballot context
        shell: bash
        id: release
        env:
          # git-cliff reads GITHUB_TOKEN from the environment
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # git-cliff applies .cliffignore to --bumped-version and --context as well, and both must see every commit: hidden entries still count toward the version and still get a ballot line
          rm --force .cliffignore

          latest_tag=$(git describe --tags --abbrev=0 || true)

          prerelease="${PRERELEASE}"

          echo "::notice::Latest tag: ${latest_tag:-none}"
          echo "::notice::Pre-release type: ${prerelease}"

          if [ -n "${latest_tag}" ] && [ -z "$(git log "${latest_tag}..HEAD" --oneline)" ]; then
            # no commits since last tag, only allow if this is a promotion through pre-release stages
            tier_of() {
              case "$1" in
                alpha) echo 0 ;;
                beta)  echo 1 ;;
                rc)    echo 2 ;;
                none)  echo 3 ;;
                *)     echo -1 ;;
              esac
            }

            if [[ "${latest_tag}" =~ -(alpha|beta|rc)\.[0-9]+$ ]]; then
              latest_type="${BASH_REMATCH[1]}"
            else
              latest_type="none"
            fi

            latest_tier=$(tier_of "${latest_type}")
            requested_tier=$(tier_of "${prerelease}")

            if [ "${requested_tier}" -le "${latest_tier}" ]; then
              echo "::error::No commits since ${latest_tag} and ${prerelease} is not a promotion from ${latest_type}."
              exit 1
            fi
          fi

          bump_flag="auto"
          bumped=$(git-cliff --bumped-version --bump ${bump_flag} --unreleased --offline)

          # If git-cliff didn't bump (e.g. chore/ci only commits), force a patch increment
          # so we never release the same version as the last tag.
          if [ "${bumped}" = "${latest_tag}" ]; then
            bump_flag="patch"
            bumped=$(git-cliff --bumped-version --bump patch --unreleased --offline)
            echo "::notice::No conventional bump detected, forcing patch bump"
          fi

          version="${bumped}"

          # Strip any pre-release suffix git-cliff may have picked up (keep only vX.Y.Z)
          [[ "$version" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+) ]] && version="${BASH_REMATCH[1]}"
          echo "::notice::Base version: ${version}"
          echo "version=$version" >> "${GITHUB_OUTPUT}"

          if [ "${prerelease}" != "none" ]; then
            # Pre-release types in ascending order
            pre_types=("alpha" "beta" "rc")

            # Find the index of the requested pre-release type
            requested_index=-1
            for i in "${!pre_types[@]}"; do
              if [ "${pre_types[$i]}" = "${prerelease}" ]; then
                requested_index=$i
              fi
            done

            # Check if a higher-tier pre-release already exists for this base version
            for i in "${!pre_types[@]}"; do
              if [ "$i" -gt "$requested_index" ]; then
                if git tag --list "${version}-${pre_types[$i]}.*" | grep -q .; then
                  echo "::error::Cannot create ${prerelease} pre-release: ${pre_types[$i]} pre-release already exists for ${version}."
                  exit 1
                fi
              fi
            done

            # Determine the next pre-release number by finding the highest existing tag with this suffix
            latest_pre=$(git tag --list "${version}-${prerelease}.*" | sort --field-separator . --key 4 --numeric-sort | tail -1)

            if [ -n "$latest_pre" ]; then
              pre_number=$(( ${latest_pre##*-"${prerelease}".} + 1 ))
            else
              pre_number=1
            fi

            release_version="${version}-${prerelease}.${pre_number}"
          else
            release_version="${version}"
          fi

          echo "::notice::Release version: ${release_version}"
          echo "release_version=$release_version" >> "${GITHUB_OUTPUT}"

          branch="release/${release_version}"
          echo "::notice::Branch: ${branch}"
          echo "branch=$branch" >> "${GITHUB_OUTPUT}"

          commit_message="chore(release): prepare for ${release_version}"
          echo "commit_message=${commit_message}" >> "${GITHUB_OUTPUT}"

          main_sha=$(git rev-parse HEAD)
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"

          # The PR body is a ballot listing every commit, and git-cliff applies .cliffignore when building a context, so build it before the seeded selection lands in the worktree
          git-cliff --context --unreleased --tag "${release_version}" > ballot-context.json

      - name: List open release PRs of this pre-release type
        shell: bash
        id: siblings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Other types are independent releases, they neither feed nor get superseded by this one.
          # release/v1.2.3 -> none, release/v1.2.3-alpha.1 -> alpha
          gh pr list \
            --state open \
            --limit 100 \
            --json number,headRefName \
          | jq --raw-output \
              --arg prerelease "${PRERELEASE}" \
              --arg re '-(?<type>alpha|beta|rc)\.[0-9]+$' '
              .[]
              | select(.headRefName | startswith("release/v"))
              | select((.headRefName | if test($re) then capture($re).type else "none" end) == $prerelease)
              | "\(.number) \(.headRefName)"
            ' > "${RUNNER_TEMP}/siblings.txt"

          echo "file=${RUNNER_TEMP}/siblings.txt" >> "${GITHUB_OUTPUT}"

      - name: Seed the selection and generate the changelog
        shell: bash
        env:
          # git-cliff reads GITHUB_TOKEN from the environment
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          SIBLINGS_FILE: ${{ steps.siblings.outputs.file }}
        run: |
          # An entry ships only when checked, so every unreleased commit starts excluded
          jq --raw-output '.[0].commits[].id' ballot-context.json | sort --unique > "${RUNNER_TEMP}/unreleased.txt"

          # Carry over the checked entries from an earlier run of this release and from the same-type release PRs this run supersedes, their CHANGELOG.md ships exactly those
          : > "${RUNNER_TEMP}/checked.txt"

          {
            if git ls-remote --exit-code --heads origin "${BRANCH}" > /dev/null; then
              echo "${BRANCH}"
            fi

            cut --delimiter=" " --fields=2 "${SIBLINGS_FILE}"
          } | sort --unique | while IFS= read -r source_branch; do
            git fetch origin "refs/heads/${source_branch}"
            git show "FETCH_HEAD:CHANGELOG.md" 2> /dev/null \
              | grep --perl-regexp --only-matching '/commit/\K[0-9a-f]{40}(?=\)\)$)' >> "${RUNNER_TEMP}/checked.txt" || true
          done

          # The exclusions accumulate across releases, so start from the copy main carries
          git show HEAD:.cliffignore > .cliffignore 2> /dev/null || : > .cliffignore

          grep --fixed-strings --line-regexp --invert-match --file "${RUNNER_TEMP}/checked.txt" "${RUNNER_TEMP}/unreleased.txt" >> .cliffignore || true
          sort --unique --output .cliffignore .cliffignore

          # git-cliff skips the commits listed in .cliffignore
          git-cliff --output CHANGELOG.md --tag "${RELEASE_VERSION}"

      - name: Create release commit
        id: commit
        uses: $/.github/actions/create-release-commit
        with:
          branch: ${{ steps.release.outputs.branch }}
          base-sha: ${{ steps.release.outputs.main_sha }}
          headline: ${{ steps.release.outputs.commit_message }}
          files: CHANGELOG.md .cliffignore
          # GITHUB_TOKEN attributes the API commit to github-actions[bot]. The branch itself is pushed with the checkout PAT so workflows trigger.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render the ballot
        id: ballot
        uses: $/.github/actions/render-ballot-body
        with:
          context-file: ballot-context.json
          compare-to: ${{ steps.commit.outputs.commit-sha }}
          excluded-file: .cliffignore

      - name: Open or update pull request
        shell: bash
        env:
          AUTO_MERGE: ${{ inputs.auto_merge }}
          BODY_FILE: ${{ steps.ballot.outputs.body-file }}
          BRANCH: ${{ steps.release.outputs.branch }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TOKEN_TO_TRIGGER_SUBSEQUENT_WORKFLOWS }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          # Check if a PR already exists for this branch
          existing_pr=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')

          if [ -n "$existing_pr" ]; then
            # Refresh the body with the default token: its edits don't fire pull_request events, so this can't trigger the apply workflow. REST PATCH instead of gh pr edit, which needs read:org (cli/cli#13575).
            GH_TOKEN="${DEFAULT_TOKEN}" gh api --method PATCH --silent "repos/${GITHUB_REPOSITORY}/pulls/${existing_pr}" \
              --field "body=@${BODY_FILE}"
          else
            # Opened with the PAT, the default token's pull_request events don't run the required checks
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "chore(release): Release ${RELEASE_VERSION}" \
              --body-file "${BODY_FILE}"
          fi

          if [ "${AUTO_MERGE}" = "true" ]; then
            gh pr merge "${BRANCH}" --auto --merge
          fi

      - name: Close superseded release PRs
        shell: bash
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIBLINGS_FILE: ${{ steps.siblings.outputs.file }}
        run: |
          # Commits landing after a release PR was opened can move the version, and with it the release branch name.
          # The PR for the previous version then has nothing left to release, its checked entries were carried over above.
          new_pr=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number')

          while read -r pr_number head_ref; do
            if [ "${head_ref}" = "${BRANCH}" ]; then
              continue
            fi

            echo "::notice::Closing #${pr_number}, superseded by #${new_pr}"

            gh pr close "${pr_number}" --delete-branch --comment "Superseded by #${new_pr}."
          done < "${SIBLINGS_FILE}"

      - name: Re-run when main moved during this run
        shell: bash
        env:
          AUTO_MERGE: ${{ inputs.auto_merge }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_SHA: ${{ steps.release.outputs.main_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # A push landing between the checkout and the PR going up is invisible to
          # "Rebuild release after push", which only dispatches for PRs that already exist.
          current_main=$(git ls-remote origin refs/heads/main | cut --fields 1)

          if [ "${current_main}" = "${MAIN_SHA}" ]; then
            exit 0
          fi

          echo "::notice::main moved from ${MAIN_SHA} to ${current_main} during this run, dispatching again"

          gh workflow run release.yml \
            --ref main \
            --raw-field prerelease="${PRERELEASE}" \
            --raw-field auto_merge="${AUTO_MERGE}"

      - name: Clean up stranded branches
        if: ${{ (failure() || cancelled()) && steps.release.outputs.branch != '' }}
        shell: bash
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin --delete "${BRANCH}-staging" || true

          # Deleting the release branch would close its PR, so keep it when one exists.
          # A failing `gh pr list` fails the step (set -e) instead of counting as "no PR".
          open_pr=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')

          if [ -z "${open_pr}" ]; then
            git push origin --delete "${BRANCH}" || true
          fi
