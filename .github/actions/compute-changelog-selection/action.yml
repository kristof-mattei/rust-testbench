# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Compute changelog selection
description: Derive the .cliffignore contents from the release PR body's ballot checkboxes

inputs:
  body:
    description: Release PR body containing the ballot
    required: true
  head:
    description: Commit whose selection is being computed
    required: false
    default: HEAD

outputs:
  selection-file:
    description: Path to the computed .cliffignore contents
    value: ${{ steps.compute.outputs.selection-file }}
  base-sha:
    description: Commit the release branch is built on
    value: ${{ steps.compute.outputs.base-sha }}

runs:
  using: composite
  steps:
    - name: Compute selection
      id: compute
      shell: bash
      env:
        BODY: ${{ inputs.body }}
        HEAD_SHA: ${{ inputs.head }}
      run: |
        # The release commit sits exactly one commit above main, and a PR merge commit's first parent is that same main commit
        base_sha=$(git rev-parse "${HEAD_SHA}~1")
        echo "base-sha=${base_sha}" >> "${GITHUB_OUTPUT}"

        printf '%s' "${BODY}" > "${RUNNER_TEMP}/body.md"

        # Ballot lines end with the entry's own link, `- [x] ... ([`abc1234`](https://.../commit/<sha>))`
        # Anchoring on that trailing link skips /commit/ URLs a commit subject may contain, a hand-edited [X] counts as checked
        grep --perl-regexp --only-matching '^- \[[xX ]\] .*/commit/\K[0-9a-f]{40}(?=\)\)\r?$)' "${RUNNER_TEMP}/body.md" | sort --unique > "${RUNNER_TEMP}/ballot.txt" || true
        grep --perl-regexp --only-matching '^- \[ \] .*/commit/\K[0-9a-f]{40}(?=\)\)\r?$)' "${RUNNER_TEMP}/body.md" | sort --unique > "${RUNNER_TEMP}/unchecked.txt" || true

        # An exclusion with no ballot line (pre-existing, or truncated off the body) has no checkbox to toggle, it keeps the commit's own state
        git show "${HEAD_SHA}:.cliffignore" > "${RUNNER_TEMP}/carried.txt" 2> /dev/null || true

        # Keep the ballot-less exclusions, replace the ballot's with the unchecked set
        awk 'NR == FNR { ballot[$0] = 1; next } !($0 in ballot)' "${RUNNER_TEMP}/ballot.txt" "${RUNNER_TEMP}/carried.txt" > "${RUNNER_TEMP}/kept.txt"
        cat "${RUNNER_TEMP}/kept.txt" "${RUNNER_TEMP}/unchecked.txt" | sort --unique > "${RUNNER_TEMP}/computed.cliffignore"

        echo "selection-file=${RUNNER_TEMP}/computed.cliffignore" >> "${GITHUB_OUTPUT}"
