# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Render ballot body
description: Render a git-cliff context as the release PR body, every changelog entry a checkbox

inputs:
  context-file:
    description: git-cliff context JSON listing every entry, including the excluded ones
    required: true
  compare-to:
    description: Commit the changelog's compare link points at
    required: true
  excluded-file:
    description: File of commit SHAs to render unchecked, empty or missing means everything stays checked
    required: false
    default: ""

outputs:
  body-file:
    description: Path to the rendered pull request body
    value: ${{ steps.render.outputs.body-file }}

runs:
  using: composite
  steps:
    - name: Render ballot
      id: render
      shell: bash
      env:
        CONTEXT_FILE: ${{ inputs.context-file }}
        COMPARE_TO: ${{ inputs.compare-to }}
        EXCLUDED_FILE: ${{ inputs.excluded-file }}
      run: |
        body_file="${RUNNER_TEMP}/ballot-body.md"

        # Point the compare link at the release-branch head SHA, because the release tag doesn't exist until after the PR is merged
        jq --arg sha "${COMPARE_TO}" '.[0].extra = {compare_to: $sha}' "${CONTEXT_FILE}" > "${RUNNER_TEMP}/diff-context.json"

        # --from-context renders the context as-is, so the ballot lists every commit even though CHANGELOG.md has the excluded ones removed
        git-cliff --from-context "${RUNNER_TEMP}/diff-context.json" --output "${body_file}"

        # Render every entry as a checkbox, excluded entries as unchecked
        sed --in-place 's/^- /- [x] /' "${body_file}"

        if [ -n "${EXCLUDED_FILE}" ] && [ -s "${EXCLUDED_FILE}" ]; then
          while IFS= read -r sha; do
            [ -n "${sha}" ] || continue
            # Anchoring on the entry's trailing link skips /commit/ URLs a commit subject may contain
            sed --in-place "\|/commit/${sha}))\$|s/^- \[x\]/- [ ]/" "${body_file}"
          done < "${EXCLUDED_FILE}"
        fi

        {
          cat <<'INSTRUCTIONS'
        > [!NOTE]
        > This body is a ballot, entries start unchecked and only the checked entries ship in `CHANGELOG.md` and the release notes.
        > Checking an entry adds it to both, a workflow rebuilds the release commit after every toggle.
        > Unchecked commits still ship in the release and still count toward the version number.
        > A toggle disarms auto-merge, re-arm it once the ballot is final.

        INSTRUCTIONS
          cat "${body_file}"
        } > "${body_file}.with-instructions"
        mv "${body_file}.with-instructions" "${body_file}"

        # Truncate at line boundaries if the body exceeds GitHub's PR body character limit, a cut entry has no checkbox and stays excluded
        max_length=65536
        marker_template=$'\n\n---\n\n> **Note:** COUNT more entries exceed GitHub\'s 65,536 character body limit. They are not shown and stay excluded from the changelog.'
        body=$(< "${body_file}")

        if [ "${#body}" -gt "${max_length}" ]; then
          # The dropped count never has more digits than the total count, so this budget always fits the final marker
          total_entries=$(grep --count '^- \[' "${body_file}" || true)
          bound_marker="${marker_template/COUNT/${total_entries}}"
          budget=$(( max_length - ${#bound_marker} ))

          kept_lines=0
          kept_length=0
          dropped_entries=0
          cutting=0

          while IFS= read -r line; do
            if [ "${cutting}" -eq 0 ] && [ $(( kept_length + ${#line} + 1 )) -le "${budget}" ]; then
              kept_length=$(( kept_length + ${#line} + 1 ))
              kept_lines=$(( kept_lines + 1 ))
            else
              cutting=1

              case "${line}" in
                "- ["*) dropped_entries=$(( dropped_entries + 1 )) ;;
              esac
            fi
          done < "${body_file}"

          {
            head --lines="${kept_lines}" "${body_file}"
            printf '%s' "${marker_template/COUNT/${dropped_entries}}"
          } > "${body_file}.truncated"
          mv "${body_file}.truncated" "${body_file}"
        fi

        echo "body-file=${body_file}" >> "${GITHUB_OUTPUT}"
